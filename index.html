<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Educandário Espírita Mãe Zeferina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
        <!-- Cabeçalho / Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600 text-white rounded-xl font-bold text-xl mb-3 shadow-md shadow-blue-500/20">
                M
            </div>
            <h1 class="text-xs font-semibold tracking-wider text-blue-600 uppercase">Educandário Espírita</h1>
            <h2 class="text-2xl font-bold text-slate-900">Mãe Zeferina</h2>
        </div>

        <!-- Abas de Perfil -->
        <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl mb-6 text-xs font-medium text-slate-600">
            <button class="py-2 bg-white rounded-lg shadow-sm text-blue-600 font-semibold text-center">Secretaria</button>
            <button class="py-2 text-center hover:text-slate-900">Professor</button>
            <button class="py-2 text-center hover:text-slate-900">Psicologia</button>
        </div>

        <!-- Formulário -->
        <form action="dashboard.html" method="GET" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">E-mail ou Matrícula</label>
                <input type="text" required placeholder="neide@maezeferina.org.br" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-semibold text-slate-700">Senha</label>
                    <a href="#" class="text-xs text-blue-600 hover:underline">Esqueceu a senha?</a>
                </div>
                <input type="password" required placeholder="••••••••" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600">
            </div>

            <div class="flex items-center">
                <input type="checkbox" id="remember" class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
                <label for="remember" class="ml-2 text-xs text-slate-600">Manter conectado neste dispositivo</label>
            </div>

            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/25 transition-all text-sm">
                Entrar no Sistema &rarr;
            </button>
        </form>

        <!-- Rodapé do Card -->
        <div class="mt-8 pt-4 border-t border-slate-100 text-center">
            <p class="text-[11px] text-slate-400">Acesso restrito aos 15 colaboradores e estagiários autorizados.</p>
        </div>
    </div>

</body>
</html>
