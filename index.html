<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Educandário Espírita Mãe Zeferina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
        <!-- Cabeçalho / Logo Oficial -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-blue-50 rounded-2xl p-2 mb-3 border border-blue-100 shadow-sm">
                <!-- Inserindo a logo real que você enviou -->
                <img src="logo-maezeferina.jpg" alt="Logo Educandário Mãe Zeferina" class="w-full h-full object-contain rounded-xl">
            </div>
            <h1 class="text-[11px] font-bold tracking-wider text-blue-600 uppercase">Escola Filantrópica</h1>
            <h2 class="text-xl font-bold text-slate-900 leading-tight">Educandário Espírita<br>Mãe Zeferina</h2>
        </div>

        <!-- Abas de Perfil Interativas -->
        <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl mb-6 text-xs font-medium text-slate-600" id="perfilTabs">
            <button type="button" onclick="selecionarPerfil('Secretaria')" class="py-2 bg-white rounded-lg shadow-sm text-blue-600 font-semibold text-center transition-all">Secretaria</button>
            <button type="button" onclick="selecionarPerfil('Professor')" class="py-2 text-center hover:text-slate-900 transition-all">Professor</button>
            <button type="button" onclick="selecionarPerfil('Psicologia')" class="py-2 text-center hover:text-slate-900 transition-all">Psicologia</button>
        </div>

        <!-- Formulário de Login -->
        <form id="loginForm" onsubmit="realizarLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">E-mail Cadastrado</label>
                <input type="email" id="emailInput" required placeholder="ex: neide.direcao@gmail.com" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600">
                <p class="text-[10px] text-slate-400 mt-1">Acesso seguro para colaboradores e estagiários.</p>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-semibold text-slate-700">Senha</label>
                    <a href="#" class="text-xs text-blue-600 hover:underline">Esqueceu a senha?</a>
                </div>
                <input type="password" required placeholder="••••••••" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600">
            </div>

            <div class="flex items-center">
                <input type="checkbox" id="remember" class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
                <label for="remember" class="ml-2 text-xs text-slate-600">Manter conectado neste dispositivo</label>
            </div>

            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/25 transition-all text-sm flex items-center justify-center space-x-2">
                <span>Entrar no Sistema</span>
                <span>&rarr;</span>
            </button>
        </form>

        <!-- Rodapé do Card com Endereço e Contato Real -->
        <div class="mt-6 pt-4 border-t border-slate-100 text-center space-y-1">
            <p class="text-[10px] text-slate-500 font-medium">📍 Rua Cabriúva, nº 14, Parque Geórgia • Cuiabá/MT</p>
            <p class="text-[10px] text-slate-400">📞 (65) 3044-4557 • Educação Infantil ao Fundamental I</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
